name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: native-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            real_capture: true
          - os: macos-latest
            real_capture: true
          - os: windows-latest
            real_capture: false

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux capture deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang jq libpcap-dev llvm shellcheck

      - name: Test capture monitoring scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck -x scripts/watch-packrat-health.sh tests/test_watch_packrat_health.sh
          shellcheck scripts/watch-packrat-alerts.sh tests/test_watch_packrat_alerts.sh
          shellcheck scripts/watch-packrat-socket-context.sh tests/test_watch_packrat_socket_context.sh
          shellcheck -x scripts/packrat-triage.sh tests/test_packrat_triage.sh
          shellcheck -x scripts/watch-packrat-triage.sh tests/test_watch_packrat_triage.sh
          shellcheck scripts/packrat-watch-coverage.sh tests/test_packrat_watch_coverage.sh
          shellcheck scripts/packrat-watch-baseline.sh tests/test_packrat_watch_baseline.sh
          shellcheck scripts/packrat-review-backlog.sh tests/test_packrat_review_backlog.sh
          shellcheck scripts/packrat-review-alert-gaps.sh tests/test_packrat_review_alert_gaps.sh
          shellcheck scripts/packrat-replay-suite.sh tests/test_packrat_replay_suite.sh
          bash tests/test_watch_packrat_health.sh
          bash tests/test_watch_packrat_alerts.sh
          bash tests/test_watch_packrat_socket_context.sh
          bash tests/test_packrat_triage.sh
          bash tests/test_watch_packrat_triage.sh
          bash tests/test_packrat_watch_coverage.sh
          bash tests/test_packrat_watch_baseline.sh
          bash tests/test_packrat_review_backlog.sh
          bash tests/test_packrat_review_alert_gaps.sh
          bash tests/test_packrat_replay_suite.sh

      - name: Test supervised capture rollout
        if: runner.os == 'Linux'
        run: |
          shellcheck -x scripts/packrat-rollout.sh tests/test_packrat_rollout.sh tests/test_packrat_rollout_release.sh
          bash tests/test_packrat_rollout.sh
          bash tests/test_packrat_rollout_release.sh
          shellcheck -x scripts/packrat-build-rollout.sh tests/test_packrat_build_rollout.sh
          bash tests/test_packrat_build_rollout.sh

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked

      - name: Replay a labeled corpus through the real analyzer
        if: runner.os == 'Linux'
        run: cargo test --locked --test replay_suite_integration_tests -- --ignored

      - name: Headless build without terminal dependencies
        run: cargo test --locked --no-default-features --all-targets

      - name: cargo check --features real-capture
        if: matrix.real_capture
        run: cargo check --locked --features real-capture

      - name: Build eBPF socket program
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/ebpf
          clang -O2 -g -target bpfel -D__TARGET_ARCH_x86 -Wall -Werror -I ebpf \
            -c ebpf/packrat_socket.bpf.c -o target/ebpf/packrat_socket.bpf.o
          llvm-objdump -h target/ebpf/packrat_socket.bpf.o

      - name: Check eBPF collector
        if: runner.os == 'Linux'
        run: cargo check --locked --features ebpf-sockets --bin packrat-socket-collector

  target-matrix:
    name: linux-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - i686-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - powerpc64le-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@cross

      - name: cross check
        run: cross check --locked --target ${{ matrix.target }}

  instrumentation:
    name: linux-memory-and-cpu-profile
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-Wl,--no-rosegment

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: flamegraph

      - name: Install memory and CPU instrumentation
        run: |
          sudo apt-get update
          if apt-cache show linux-perf >/dev/null 2>&1; then
            sudo apt-get install -y valgrind linux-perf
          else
            sudo apt-get install -y valgrind "linux-tools-$(uname -r)"
          fi
          perf_path=$(bash scripts/select-perf.sh "$(uname -r)")
          profiler_bin="$RUNNER_TEMP/packrat-profiler-bin"
          mkdir -p "$profiler_bin"
          ln -sf "$perf_path" "$profiler_bin/perf"
          echo "$profiler_bin" >> "$GITHUB_PATH"
          valgrind --version
          "$perf_path" --version

      - name: Build symbolized profiling workload
        run: cargo build --locked --profile profiling --bin packrat-profile

      - name: Valgrind memory safety and leak check
        run: |
          valgrind \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --track-origins=yes \
            --log-file=target/profiling/valgrind.txt \
            target/profiling/packrat-profile --packets 2000

      - name: Capture CPU profile
        run: |
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
          cargo flamegraph --profile profiling --bin packrat-profile \
            --freq 99 --no-inline \
            --output target/profiling/packrat-flamegraph.svg -- \
            --packets 1000000
          perf record --freq 99 --call-graph dwarf \
            --output target/profiling/packrat.perf.data -- \
            target/profiling/packrat-profile --packets 1000000
          perf report --stdio --no-children --sort overhead,symbol \
            --input target/profiling/packrat.perf.data \
            > target/profiling/hot-symbols.txt

      - name: Publish profiling triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packrat-linux-profile
          if-no-files-found: error
          path: |
            target/profiling/valgrind.txt
            target/profiling/hot-symbols.txt
            target/profiling/packrat-flamegraph.svg
